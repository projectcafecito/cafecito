name: Public bug report or product feedback
description: Report a non-confidential software bug or share product feedback publicly.
title: "[Bug/Feedback]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        GitHub issues are public. Do not include passwords, API keys, credentials, identification documents, sensitive personal information, confidential business details, or complete copyrighted works.

        For legal, privacy, publisher, copyright, correction, abuse, security, or other confidential matters, use https://cafecito.tech/contact/.
  - type: dropdown
    id: category
    attributes:
      label: What are you reporting?
      options:
        - Software bug
        - Documentation bug
        - Product feedback
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened or what should improve?
      description: Describe the affected product, expected behavior, actual behavior, or product feedback.
    validations:
      required: true
